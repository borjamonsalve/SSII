<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio con Selenium - Cumpleaños</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 5px; }
        .campo { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007BFF; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        #resultado { margin-top: 20px; padding: 10px; font-weight: bold; text-align: center; }
        .exito { color: green; background-color: #e6f4ea; border-radius: 4px; }
        .error { color: red; background-color: #fce8e6; border-radius: 4px; }
    </style>
</head>
<body>

    <h2>Calculadora de Cumpleaños</h2>
    
    <form id="formulario-cumple" onsubmit="calcularCumpleanos(event)">
        <div class="campo">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required placeholder="Ej. Ana">
        </div>

        <div class="campo">
            <label for="dia">Día de nacimiento:</label>
            <input type="number" id="dia" name="dia" min="1" max="31" required placeholder="Ej. 15">
        </div>

        <div class="campo">
            <label for="mes">Mes de nacimiento:</label>
            <select id="mes" name="mes" required>
                <option value="">Selecciona un mes</option>
                <option value="1">Enero</option>
                <option value="2">Febrero</option>
                <option value="3">Marzo</option>
                <option value="4">Abril</option>
                <option value="5">Mayo</option>
                <option value="6">Junio</option>
                <option value="7">Julio</option>
                <option value="8">Agosto</option>
                <option value="9">Septiembre</option>
                <option value="10">Octubre</option>
                <option value="11">Noviembre</option>
                <option value="12">Diciembre</option>
            </select>
        </div>

        <div class="campo">
            <label for="anio">Año de nacimiento:</label>
            <input type="number" id="anio" name="anio" min="1900" max="2026" required placeholder="Ej. 1995">
        </div>

        <button type="submit" id="btn-calcular">Calcular</button>
    </form>

    <div id="resultado"></div>

    <script>
        function calcularCumpleanos(event) {
            event.preventDefault();
            
            const nombre = document.getElementById('nombre').value.trim();
            const dia = parseInt(document.getElementById('dia').value);
            const mes = parseInt(document.getElementById('mes').value) - 1; // Enero es 0 en JS
            const anio = parseInt(document.getElementById('anio').value);
            const divResultado = document.getElementById('resultado');
            
            const hoy = new Date();
            const fechaNacimiento = new Date(anio, mes, dia);

            // 1. Validación de fecha correcta (ej. evitar 31 de Febrero)
            if (fechaNacimiento.getFullYear() !== anio || fechaNacimiento.getMonth() !== mes || fechaNacimiento.getDate() !== dia || fechaNacimiento > hoy) {
                divResultado.className = "error";
                divResultado.innerText = "Error: La fecha introducida no es válida o es futura.";
                return;
            }

            // 2. Determinar el próximo cumpleaños
            let proximoCumple = new Date(hoy.getFullYear(), mes, dia);
            
            // Si ya pasó el cumpleaños este año, será el próximo año
            if (hoy > proximoCumple) {
                proximoCumple.setFullYear(hoy.getFullYear() + 1);
            }

            // Calcular la edad N que cumplirá
            const edadN = proximoCumple.getFullYear() - anio;

            // 3. Calcular meses y días restantes de forma sencilla
            let mesesRestantes = proximoCumple.getMonth() - hoy.getMonth();
            let diasRestantes = proximoCumple.getDate() - hoy.getDate();

            if (diasRestantes < 0) {
                // Ajustar si los días dan negativo (ej. hoy es 20 y el cumple el 15)
                mesesRestantes--;
                const ultimoDiaMesPasado = new Date(proximoCumple.getFullYear(), proximoCumple.getMonth(), 0).getDate();
                diasRestantes += ultimoDiaMesPasado;
            }

            if (mesesRestantes < 0) {
                mesesRestantes += 12;
            }

            // 4. Mostrar resultado
            divResultado.className = "exito";
            if (mesesRestantes === 0 && diasRestantes === 0) {
                divResultado.innerText = `¡Felicidades ${nombre}! Hoy cumples ${edadN} años.`;
            } else {
                divResultado.innerText = `¡Hola ${nombre}! Para tu ${edadN}º cumpleaños quedan ${mesesRestantes} meses y ${diasRestantes} días.`;
            }
        }
    </script>
</body>
</html>
